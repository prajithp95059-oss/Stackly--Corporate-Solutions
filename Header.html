<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap');

/* ===== global.css ===== */
/* ===== Google Fonts ===== */
/* ===== CSS Variables ===== */
:root {
  --navy:        #0b1f3a;
  --navy-mid:    #112d52;
  --navy-light:  #1a3f6f;
  --accent:      #c8a96e;
  --accent-dark: #a8883f;
  --accent-light:#e0c898;
  --teal:        #1e8a7a;
  --teal-light:  #25b09b;
  --white:       #ffffff;
  --off-white:   #f4f6f9;
  --cream:       #faf8f4;
  --text:        #1e293b;
  --muted:       #64748b;
  --border:      #dde3ec;
  --shadow:      0 4px 24px rgba(11,31,58,0.10);
  --shadow-md:   0 8px 40px rgba(11,31,58,0.16);
  --shadow-lg:   0 20px 60px rgba(11,31,58,0.22);
}

/* ===== Reset ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--white);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; line-height: 1.25; }
a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }
button { cursor: pointer; font-family: 'Outfit', sans-serif; }

/* ===== Scroll Bar ===== */
#scroll-bar {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  width: 0%; z-index: 9999; transition: width 0.1s linear;
}

/* ===== Navbar ===== */
header {
  position: fixed; background: var(--navy); width: 100%; top: 0; z-index: 1000;
  transition: background 0.4s, box-shadow 0.4s;
}
header.scrolled {
  background: rgba(11,31,58,0.97);
  box-shadow: 0 2px 20px rgba(0,0,0,0.25);
  backdrop-filter: blur(12px);
}
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 80px; background: transparent; transition: padding 0.3s;
}
header.scrolled nav { padding: 14px 80px; }

/* ===== Logo ===== */
/* ===== Logo ===== */
.logo {
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo a {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo img {
  width: 48px;
  height: 48px;
  object-fit: contain;
}
.logo-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 1px;
  line-height: 1;
}
.logo-dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  background: var(--accent);
  border-radius: 2px;
  margin-left: 2px;
}

/* ===== Nav links ===== */
nav ul { display: flex; gap: 32px; list-style: none; align-items: center; }
nav a {
  color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500;
  letter-spacing: 0.4px; position: relative; padding-bottom: 4px;
  transition: color 0.3s; text-decoration: none;
}
nav a::after {
  content: ''; position: absolute; bottom: 0; left: 0;
  width: 0; height: 2px; background: var(--accent); transition: width 0.3s;
}
nav a:hover, nav a.active { color: var(--accent); }
nav a:hover::after, nav a.active::after { width: 100%; }
.nav-login {
  background: var(--accent); color: var(--navy) !important;
  padding: 9px 24px; border-radius: 4px; font-weight: 700 !important;
  transition: background 0.3s, transform 0.2s !important;
}
.nav-login::after { display: none !important; }
.nav-login:hover { background: var(--accent-dark) !important; transform: translateY(-2px); }
#menu-toggle { display: none; }
.menu-icon { display: none; font-size: 24px; color: #fff; cursor: pointer; order: 3; }
/* ===== Page Header ===== */
.page-header {
  padding: 100px 80px 40px; text-align: center;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, rgba(30,138,122,0.5) 100%);
  position: relative; overflow: hidden;
}
.page-header::before {
  content: ''; position: absolute; top: -100px; right: -100px;
  width: 400px; height: 400px; background: rgba(200,169,110,0.06); border-radius: 50%;
}
.page-header h1 { font-size: 52px; color: var(--white); margin-bottom: 12px; position: relative; z-index: 1; }
.page-header p { color: rgba(255,255,255,0.65); font-size: 17px; position: relative; z-index: 1; }
.breadcrumb { margin-top: 20px; font-size: 13px; color: rgba(255,255,255,0.45); position: relative; z-index: 1; }
.breadcrumb a { color: var(--accent); }
.breadcrumb span { margin: 0 6px; }

/* ===== Section Labels ===== */
.section-label {
  display: inline-block; color: var(--teal); font-size: 12px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px;
}
.section-label::before, .section-label::after { content: '—'; margin: 0 8px; opacity: 0.5; }
.section-title { font-size: 42px; color: var(--navy); margin-bottom: 16px; }
.section-sub { font-size: 16px; color: var(--muted); max-width: 560px; line-height: 1.8; }

/* ===== Buttons ===== */
.btn-primary {
  background: var(--accent); color: var(--navy);
  padding: 14px 32px; border-radius: 4px; font-size: 14px; font-weight: 700;
  border: 2px solid var(--accent); transition: all 0.3s;
  display: inline-flex; align-items: center; gap: 8px; letter-spacing: 0.3px;
}
.btn-primary:hover { background: transparent; color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(200,169,110,0.3); }
.btn-outline {
  background: transparent; color: var(--white);
  padding: 14px 32px; border-radius: 4px; font-size: 14px; font-weight: 600;
  border: 2px solid rgba(255,255,255,0.4); transition: all 0.3s;
}
.btn-outline:hover { border-color: var(--white); background: rgba(255,255,255,0.1); transform: translateY(-2px); }

/* ===== Ticker ===== */
.ticker-wrap {
  background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 50%, var(--accent-dark) 100%);
  padding: 14px 0; overflow: hidden;
}
.ticker-track {
  display: flex; gap: 60px; white-space: nowrap;
  animation: tickerScroll 30s linear infinite;
}
.ticker-track span {
  color: var(--navy); font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px; display: flex; align-items: center; gap: 14px;
  text-transform: uppercase;
}
.ticker-track span::before { content: '◆'; font-size: 8px; }
@keyframes tickerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ===== Stats Row ===== */
.stats-inner {
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.stat-item {
  text-align: center; padding: 60px 24px;
  border-right: 1px solid var(--border); transition: background 0.3s;
}
.stat-item:hover { background: var(--off-white); }
.stat-item:last-child { border-right: none; }
.stat-item h2 { font-size: 52px; color: var(--navy); font-weight: 700; line-height: 1; }
.stat-item p { font-size: 14px; color: var(--muted); margin-top: 8px; font-weight: 500; }

/* ===== CTA Section ===== */
.cta-section {
  padding: 100px 80px; text-align: center;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, rgba(30,138,122,0.4) 100%);
  position: relative; overflow: hidden;
}
.cta-section::before {
  content: ''; position: absolute; top: -80px; right: -80px;
  width: 350px; height: 350px; background: rgba(200,169,110,0.06); border-radius: 50%;
}
.cta-section h2 { font-size: 46px; color: var(--white); margin-bottom: 14px; position: relative; z-index:1; }
.cta-section p  { color: rgba(255,255,255,0.65); font-size: 17px; margin-bottom: 40px; max-width: 520px; margin-left: auto; margin-right: auto; position: relative; z-index:1; }
.cta-section .hero-btns { justify-content: center; position: relative; z-index:1; }
.hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }

/* ===== Footer ===== */
footer { background: var(--navy); color: var(--white); padding: 80px 80px 0; }
.footer-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; gap: 60px;
  padding-bottom: 60px; border-bottom: 1px solid rgba(255,255,255,0.08);
}
.footer-brand p { font-size: 14px; color: rgba(255,255,255,0.45); margin-top: 14px; line-height: 1.8; }
.footer-socials { display: flex; gap: 10px; margin-top: 24px; }
.social-btn {
  width: 38px; height: 38px; background: rgba(255,255,255,0.06); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
  color: rgba(255,255,255,0.5); transition: all 0.3s;
}
.social-btn:hover { background: var(--accent); color: var(--navy); }
.footer-col h4 { font-size: 14px; color: var(--white); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 20px; }
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.footer-col ul li a { color: rgba(255,255,255,0.45); font-size: 14px; transition: color 0.2s; }
.footer-col ul li a:hover { color: var(--accent); }
.footer-contact p { display: flex; gap: 10px; font-size: 14px; color: rgba(255,255,255,0.45); margin-bottom: 12px; }
.footer-newsletter input {
  width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  padding: 12px 16px; border-radius: 6px; font-size: 13px;
  font-family: 'Outfit', sans-serif; color: var(--white); margin-bottom: 10px;
}
.footer-newsletter input::placeholder { color: rgba(255,255,255,0.3); }
.footer-newsletter input:focus { outline: none; border-color: var(--accent); }
.footer-newsletter button {
  width: 100%; background: var(--accent); color: var(--navy); border: none;
  padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 700; transition: background 0.3s;
}
.footer-newsletter button:hover { background: var(--accent-dark); }
.footer-bottom {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 0; font-size: 13px; color: rgba(255,255,255,0.3);
}
.footer-bottom a { color: rgba(255,255,255,0.4); margin-left: 24px; transition: color 0.2s; }
.footer-bottom a:hover { color: var(--accent); }


/* ===== Animations ===== */
@keyframes fadeUp  { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
.fade-up  { opacity:0; transform:translateY(32px); transition: opacity 0.7s ease, transform 0.7s ease; }
.fade-up.visible  { opacity:1; transform:translateY(0); }
.fade-in  { opacity:0; transition: opacity 0.9s ease; }
.fade-in.visible  { opacity:1; }
.stagger-1 { transition-delay:0.1s !important; }
.stagger-2 { transition-delay:0.2s !important; }
.stagger-3 { transition-delay:0.3s !important; }
.stagger-4 { transition-delay:0.4s !important; }
.stagger-5 { transition-delay:0.5s !important; }
.stagger-6 { transition-delay:0.6s !important; }

.logo img {
  width: 36px;
  height: 36px;
  object-fit: contain;
  flex-shrink: 0;
}

/* Header logo anchor — must flex so image + text sit side by side */
.logo a {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--white);
}

/* Footer brand column wrapper */
.footer-brand {
  display: flex;
  flex-direction: column;
}

/* Footer logo anchor — flex row so image + text align */
.footer-brand > a {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

/* Footer logo text inherits .logo styles but needs a colour override */
.footer-brand .logo {
  color: var(--white);
}

   ============================================================ */

/* about.css */
/* ===== Logo ===== */
.logo {
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo a {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo img {
  width: 48px;
  height: 48px;
  object-fit: contain;
}
.logo-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--white);

}
.logo-dot {
  display: inline-block;
  width: 9px;

  background: var(--accent);
  border-radius: 2px;

}

/* ===== About Section ===== */
.about-section { padding: 100px 80px; background: #fff; }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.about-text .section-label { display: inline-block; }
.about-text h2 { font-size: 40px; color: var(--navy); margin: 14px 0 20px; }
.about-text p { color: var(--muted); font-size: 16px; margin-bottom: 16px; line-height: 1.8; }

.about-img-box { border-radius: 16px; height: 480px; overflow: hidden; position: relative; box-shadow: var(--shadow-lg); }
.about-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
.about-img-box:hover img { transform: scale(1.04); }
.about-img-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(11,31,58,0.6)); }
.about-img-caption { position: absolute; bottom: 24px; left: 24px; color: #fff; font-size: 15px; font-family: 'Cormorant Garamond', serif; font-weight: 600; z-index: 1; }
.about-img-badge { position: absolute; top: 24px; right: 24px; z-index: 1; background: var(--accent); color: var(--navy); border-radius: 10px; padding: 12px 18px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; box-shadow: 0 8px 24px rgba(200,169,110,0.4); }
.about-img-badge strong { display: block; font-size: 20px; font-family: 'Cormorant Garamond', serif; }
.about-img-badge span { font-size: 11px; opacity: 0.7; }

/* ===== Stats Strip ===== */
.stats-strip { background: var(--navy); padding: 60px 80px; }
.stats-strip-grid { display: grid; grid-template-columns: repeat(4,1fr); text-align: center; gap: 20px; }
.stats-strip-grid h3 { font-size: 48px; color: var(--accent); font-family: 'Cormorant Garamond', serif; }
.stats-strip-grid p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 6px; }
/* ===== Stat Box (inside stats-strip) ===== */
.stat-box { padding: 0 10px; }
.stat-box h3 { font-size: 48px; color: var(--accent); font-family: 'Cormorant Garamond', serif; line-height: 1; }
.stat-box p  { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 6px; }

/* ===== Svc Mini Grid ===== */
.svc-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
.svc-mini-item { background: var(--off-white); padding: 20px; border-radius: 10px; }


/* ===== Mission / Vision Section ===== */
.mv-section { padding: 100px 80px; background: var(--cream); }
.mv-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 28px; }
.mv-card { background: #fff; border-radius: 16px; padding: 44px 36px; border-top: 4px solid var(--accent); transition: box-shadow 0.3s, transform 0.3s; position: relative; overflow: hidden; }
.mv-card:nth-child(2) { border-top-color: var(--teal); }
.mv-card:nth-child(3) { border-top-color: var(--navy); }
.mv-card:hover { box-shadow: var(--shadow-md); transform: translateY(-4px); }
.mv-card h3 { font-size: 22px; color: var(--navy); margin-bottom: 14px; }
.mv-card p { color: var(--muted); font-size: 15px; line-height: 1.8; }

/* ===== Services Mini Section ===== */
.services-mini-section { padding: 100px 80px; background: #fff; }
.services-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
.services-mini-item { background: var(--off-white); padding: 20px; border-radius: 10px; }
.services-mini-item .icon { font-size: 22px; margin-bottom: 6px; }
.services-mini-item h4 { font-size: 14px; color: var(--navy); margin-bottom: 4px; }
.services-mini-item p { font-size: 13px; color: var(--muted); }

/* ===== Team Section ===== */
.team-section { padding: 100px 80px; background: #fff; }
.team-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 28px; margin-top: 60px; }
.team-card { background: var(--off-white); border-radius: 16px; overflow: hidden; transition: all 0.3s; border: 1px solid var(--border); }
.team-card:hover { box-shadow: var(--shadow-md); transform: translateY(-6px); }
.team-photo { width: 100%; height: 260px; overflow: hidden; position: relative; }
.team-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 0.5s; }
.team-card:hover .team-photo img { transform: scale(1.06); }
.team-info { padding: 20px 22px 24px; }
.team-info h4 { font-size: 18px; color: var(--navy); margin-bottom: 4px; }
.team-info span { font-size: 13px; color: var(--teal); font-weight: 600; }
.team-socials { display: flex; gap: 8px; margin-top: 12px; }
.team-social { width: 32px; height: 32px; background: var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); transition: all 0.2s; }
.team-social:hover { background: var(--accent); color: var(--navy); }

/* ============================================================
   ABOUT — ALL BREAKPOINTS

/* ============================================================
   ABOUT — RESPONSIVE MEDIA QUERIES
   Breakpoints: 1536 | 1440 | 1280 | 1024 | 900 | 768 | 640
               | 480 | 425 | 405 | 375 | 320 | 280 | 241

/* ── 1536px ── */
@media (max-width: 1536px) {
  nav { padding: 20px 60px; }
  header.scrolled nav { padding: 13px 60px; }
  footer { padding: 80px 60px 0; }
  .footer-grid { gap: 48px; }
  .page-header { padding: 150px 60px 70px; }
  .cta-section { padding: 90px 60px; }
  .about-section, .mv-section, .services-mini-section, .team-section { padding: 100px 60px; }
  .stats-strip { padding: 60px 60px; }
  .about-grid { gap: 64px; }
  .about-img-box { height: 460px; }
  .about-text h2 { font-size: 38px; }
  .logo-name { font-size: 34px; }
}

/* ── 1440px ── */
@media (max-width: 1440px) {
  .about-section, .mv-section, .services-mini-section, .team-section { padding: 100px 80px; }
  .stats-strip { padding: 60px 80px; }
  .about-grid { gap: 70px; }
  .about-text h2 { font-size: 38px; }
  .about-img-box { height: 460px; }
  .stats-strip-grid h3 { font-size: 44px; }
  .mv-card { padding: 40px 32px; }
  .mv-card h3 { font-size: 21px; }
  .team-grid { gap: 24px; }
  .team-photo { height: 250px; }
  .logo-name { font-size: 34px; }
}

/* ── 1280px ── */
@media (max-width: 1280px) {
  nav { padding: 20px 48px; }
  header.scrolled nav { padding: 13px 48px; }
  footer { padding: 70px 48px 0; }
  .footer-grid { gap: 40px; }
  nav ul { gap: 24px; }
  .page-header { padding: 140px 48px 64px; }
  .cta-section { padding: 90px 48px; }
  .section-title { font-size: 38px; }
  .about-section, .mv-section, .services-mini-section, .team-section { padding: 90px 48px; }
  .stats-strip { padding: 56px 48px; }
  .stats-strip-grid h3 { font-size: 42px; }
  .about-grid { gap: 52px; }
  .about-text h2 { font-size: 36px; }
  .about-img-box { height: 440px; }
  .mv-card { padding: 38px 30px; }
  .team-grid { gap: 20px; }
  .team-photo { height: 240px; }
  .logo-name { font-size: 32px; }
}

/* ── 1024px ── */
@media (max-width: 1024px) {
  nav { padding: 18px 36px; }
  header.scrolled nav { padding: 12px 36px; }
  footer { padding: 64px 36px 0; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 36px; }
  nav ul { gap: 20px; }
  nav a { font-size: 13px; }
  .page-header { padding: 130px 36px 60px; }
  .page-header h1 { font-size: 44px; }
  .cta-section { padding: 80px 36px; }
  .cta-section h2 { font-size: 40px; }
  .section-title { font-size: 36px; }
  .about-section, .mv-section, .services-mini-section, .team-section { padding: 80px 36px; }
  .stats-strip { padding: 52px 36px; }
  .stats-strip-grid { grid-template-columns: repeat(2,1fr); gap: 16px; }
  .stats-strip-grid h3 { font-size: 40px; }
  .about-grid { gap: 40px; }
  .about-text h2 { font-size: 34px; }
  .about-img-box { height: 400px; }
  .mv-grid { grid-template-columns: repeat(3,1fr); gap: 20px; }
  .mv-card { padding: 32px 24px; }
  .team-grid { grid-template-columns: repeat(2,1fr); gap: 20px; margin-top: 40px; }
  .team-photo { height: 240px; }
  .logo-name { font-size: 30px; }
  .services-mini-grid { grid-template-columns: 1fr 1fr; }
}

/* ── 900px ── */
@media (max-width: 900px) {
  nav { padding: 16px 28px; }
  header.scrolled nav { padding: 12px 28px; }
  footer { padding: 56px 28px 0; }
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 28px; }
  .page-header { padding: 124px 28px 56px; }

/* ── Visibility fix ── */

/* ============================================================
   ANIMATIONS — Stackly Reference Implementation
   ============================================================ */

/* ── Keyframes ── */
@keyframes fadeUpIn {
  from { opacity: 0; transform: translateY(36px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes fadeLeft {
  from { opacity: 0; transform: translateX(-32px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes fadeRight {
  from { opacity: 0; transform: translateX(32px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes imgFloat1 {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%       { transform: translateY(-14px) rotate(-1deg); }
}
@keyframes imgFloat2 {
  0%, 100% { transform: translateY(0) rotate(2deg); }
  50%       { transform: translateY(-10px) rotate(2deg); }
}
@keyframes scrollBounce {
  0%, 100% { top: 6px; }
  50%       { top: 18px; opacity: 0.3; }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.04); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
@keyframes countUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes borderGrow {
  from { width: 0; }
  to   { width: 100%; }
}
@keyframes navSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spinOnce {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes heroGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
  50%       { box-shadow: 0 0 32px 8px rgba(200,169,110,0.18); }
}
@keyframes tickerScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ── Scroll-reveal base: elements start hidden ── */
.sa {
  opacity: 0;
  transform: translateY(36px);
  transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1),
              transform 0.75s cubic-bezier(0.16,1,0.3,1);
}
.sa.sa-left  { transform: translateX(-36px); }
.sa.sa-right { transform: translateX(36px); }
.sa.sa-scale { transform: scale(0.92); }
.sa.sa-fast  { transition-duration: 0.45s; }
.sa.sa-slow  { transition-duration: 1.1s; }

.sa.visible {
  opacity: 1 !important;
  transform: none !important;
}

/* Stagger delays */
.sa.d1 { transition-delay: 0.08s; }
.sa.d2 { transition-delay: 0.16s; }
.sa.d3 { transition-delay: 0.24s; }
.sa.d4 { transition-delay: 0.32s; }
.sa.d5 { transition-delay: 0.40s; }
.sa.d6 { transition-delay: 0.48s; }

/* ── Keep existing fade-up working (but not broken by !important override) ── */
.fade-up  { opacity: 0; transform: translateY(32px); transition: opacity 0.7s ease, transform 0.7s ease; }
.fade-up.visible  { opacity: 1 !important; transform: translateY(0) !important; }
.fade-in  { opacity: 0; transition: opacity 0.9s ease; }
.fade-in.visible  { opacity: 1 !important; }

/* ── Hover micro-interactions ── */
.hover-lift {
  transition: transform 0.28s cubic-bezier(0.16,1,0.3,1),
              box-shadow 0.28s cubic-bezier(0.16,1,0.3,1);
}
.hover-lift:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 48px rgba(11,31,58,0.18);
}

/* ── Button press effect ── */
.btn-primary, .btn-outline {
  transition: transform 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s, border-color 0.3s !important;
}
.btn-primary:active, .btn-outline:active { transform: scale(0.97) !important; }

/* ── Card hover border accent ── */
.service-card, .testi-card, .process-step, .why-card, .industry-item,
.job-card, .mv-card, .team-card, .svc-page-card, .blog-card, .ann-item {
  transition: transform 0.32s cubic-bezier(0.16,1,0.3,1),
              box-shadow 0.32s cubic-bezier(0.16,1,0.3,1),
              border-color 0.32s !important;
}
.service-card:hover, .process-step:hover, .testi-card:hover,
.industry-item:hover, .job-card:hover, .mv-card:hover,
.team-card:hover, .blog-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 48px rgba(11,31,58,0.16) !important;
}
.why-card:hover { transform: translateY(-4px) !important; }

/* ── Nav link underline animation ── */
nav a::after {
  transition: width 0.28s cubic-bezier(0.16,1,0.3,1) !important;
}

/* ── Logo pulse on load ── */
.logo { animation: slideDown 0.6s cubic-bezier(0.16,1,0.3,1) both; }

/* ── Ticker ── */
.ticker-track { animation: tickerScroll 30s linear infinite; }
.ticker-wrap:hover .ticker-track { animation-play-state: paused; }

/* ── Hero floating images (index) ── */
.hv-img-1 { animation: imgFloat1 6s ease-in-out infinite; }
.hv-img-2 { animation: imgFloat2 7s ease-in-out infinite 1s; }
.hv-img-3 { animation: imgFloat1 8s ease-in-out infinite 2s; }
.hv-badge { animation: imgFloat2 5s ease-in-out infinite 0.5s; }

/* ── Scroll dot bounce ── */
.scroll-dot::before { animation: scrollBounce 1.8s infinite; }

/* ── Why card top border reveal ── */
.why-card::before {
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1) !important;
}
.why-card:hover::before { transform: scaleX(1) !important; }

/* ── Stat counter fade ── */
.stat-item, .stat-card { animation: countUp 0.6s ease both; }
.stat-item:nth-child(1), .stat-card:nth-child(1) { animation-delay: 0.05s; }
.stat-item:nth-child(2), .stat-card:nth-child(2) { animation-delay: 0.12s; }
.stat-item:nth-child(3), .stat-card:nth-child(3) { animation-delay: 0.19s; }
.stat-item:nth-child(4), .stat-card:nth-child(4) { animation-delay: 0.26s; }

/* ── Section label dash reveal ── */
.section-label {
  animation: fadeUpIn 0.6s ease both;
  display: inline-block;
}

/* ── Progress bar animation (staff/admin) ── */
.progress-fill {
  transition: width 1.2s cubic-bezier(0.16,1,0.3,1) !important;
}

/* ── Social btn hover spin ── */
.social-btn { transition: background 0.28s, color 0.28s, transform 0.28s !important; }
.social-btn:hover { transform: translateY(-3px) scale(1.08) !important; }

/* ── FAQ arrow transition ── */
.faq-arrow { transition: transform 0.3s ease !important; }
.faq-item.active .faq-arrow { transform: rotate(180deg) !important; }

/* ── Page header decorative pulse ── */
.page-header::before { animation: pulse 8s ease-in-out infinite; }
.welcome-banner::after { animation: pulse 10s ease-in-out infinite 2s; }

/* ── Footer newsletter button ── */
.footer-newsletter button {
  transition: background 0.25s, transform 0.2s !important;
}
.footer-newsletter button:hover { transform: translateY(-2px) !important; }

/* ── Industry item image zoom ── */
.ind-img img { transition: transform 0.55s ease !important; }
.industry-item:hover .ind-img img { transform: scale(1.12) !important; }

/* ── Nav login button ── */
