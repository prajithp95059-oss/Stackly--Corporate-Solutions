@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap');

/* ===== 404page.css ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a227;

      --gold-dark: #9a7a1a;
      --black: #ffffff;

      align-items: center;

    /* Subtle grid background */

    p {
      color: #777;

      line-height: 1.7;

    .divider {

    .btn-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 13px 28px;
      background: var(--gold);
      color: #fff;
      border: none;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: .8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(201,162,39,.25);
      transition: background .3s, transform .2s, box-shadow .3s;
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(201,162,39,.35);
    }

    .btn-ghost {
      padding: 13px 28px;
      background: transparent;
      color: #444;
      border: 1.5px solid rgba(0,0,0,.18);
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: .8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color .3s, color .3s, transform .2s, background .3s;
    }
    .btn-ghost:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,162,39,.05);

    }

    /* Arrow icons */
    .arrow-left { font-size: 1rem; line-height: 1; }
    .arrow-home { font-size: 1rem; line-height: 1; }

    .footer-note {

      font-size: .72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #bbb;
      font-weight: 400;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }

    @media (max-width: 480px) {

/* ============================================================
   ANIMATIONS — Stackly Reference Implementation
   ============================================================ */

/* ── Keyframes ── */
@keyframes fadeUpIn {
  from { opacity: 0; transform: translateY(36px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes fadeLeft {
  from { opacity: 0; transform: translateX(-32px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes fadeRight {
  from { opacity: 0; transform: translateX(32px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes imgFloat1 {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%       { transform: translateY(-14px) rotate(-1deg); }
}
@keyframes imgFloat2 {
  0%, 100% { transform: translateY(0) rotate(2deg); }
  50%       { transform: translateY(-10px) rotate(2deg); }
}
@keyframes scrollBounce {
  0%, 100% { top: 6px; }
  50%       { top: 18px; opacity: 0.3; }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.04); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
@keyframes countUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes borderGrow {
  from { width: 0; }
  to   { width: 100%; }
}
@keyframes navSlideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spinOnce {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes heroGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
  50%       { box-shadow: 0 0 32px 8px rgba(200,169,110,0.18); }
}
@keyframes tickerScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ── Scroll-reveal base: elements start hidden ── */
.sa {
  opacity: 0;
  transform: translateY(36px);
  transition: opacity 0.75s cubic-bezier(0.16,1,0.3,1),
              transform 0.75s cubic-bezier(0.16,1,0.3,1);
}
.sa.sa-left  { transform: translateX(-36px); }
.sa.sa-right { transform: translateX(36px); }
.sa.sa-scale { transform: scale(0.92); }
.sa.sa-fast  { transition-duration: 0.45s; }
.sa.sa-slow  { transition-duration: 1.1s; }

.sa.visible {
  opacity: 1 !important;
  transform: none !important;
}

/* Stagger delays */
.sa.d1 { transition-delay: 0.08s; }
.sa.d2 { transition-delay: 0.16s; }
.sa.d3 { transition-delay: 0.24s; }
.sa.d4 { transition-delay: 0.32s; }
.sa.d5 { transition-delay: 0.40s; }
.sa.d6 { transition-delay: 0.48s; }

/* ── Keep existing fade-up working (but not broken by !important override) ── */
.fade-up  { opacity: 0; transform: translateY(32px); transition: opacity 0.7s ease, transform 0.7s ease; }
.fade-up.visible  { opacity: 1 !important; transform: translateY(0) !important; }
.fade-in  { opacity: 0; transition: opacity 0.9s ease; }
.fade-in.visible  { opacity: 1 !important; }

/* ── Hover micro-interactions ── */
.hover-lift {
  transition: transform 0.28s cubic-bezier(0.16,1,0.3,1),
              box-shadow 0.28s cubic-bezier(0.16,1,0.3,1);
}
.hover-lift:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 48px rgba(11,31,58,0.18);
}

/* ── Button press effect ── */
.btn-primary, .btn-outline {
  transition: transform 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s, border-color 0.3s !important;
}
.btn-primary:active, .btn-outline:active { transform: scale(0.97) !important; }

/* ── Card hover border accent ── */
.service-card, .testi-card, .process-step, .why-card, .industry-item,
.job-card, .mv-card, .team-card, .svc-page-card, .blog-card, .ann-item {
  transition: transform 0.32s cubic-bezier(0.16,1,0.3,1),
              box-shadow 0.32s cubic-bezier(0.16,1,0.3,1),
              border-color 0.32s !important;
}
.service-card:hover, .process-step:hover, .testi-card:hover,
.industry-item:hover, .job-card:hover, .mv-card:hover,
.team-card:hover, .blog-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 48px rgba(11,31,58,0.16) !important;
}
.why-card:hover { transform: translateY(-4px) !important; }

/* ── Nav link underline animation ── */
nav a::after {
  transition: width 0.28s cubic-bezier(0.16,1,0.3,1) !important;
}

/* ── Logo pulse on load ── */
.logo { animation: slideDown 0.6s cubic-bezier(0.16,1,0.3,1) both; }

/* ── Ticker ── */
.ticker-track { animation: tickerScroll 30s linear infinite; }
.ticker-wrap:hover .ticker-track { animation-play-state: paused; }

/* ── Hero floating images (index) ── */
.hv-img-1 { animation: imgFloat1 6s ease-in-out infinite; }
.hv-img-2 { animation: imgFloat2 7s ease-in-out infinite 1s; }
.hv-img-3 { animation: imgFloat1 8s ease-in-out infinite 2s; }
.hv-badge { animation: imgFloat2 5s ease-in-out infinite 0.5s; }

/* ── Scroll dot bounce ── */
.scroll-dot::before { animation: scrollBounce 1.8s infinite; }

/* ── Why card top border reveal ── */
.why-card::before {
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1) !important;
}
.why-card:hover::before { transform: scaleX(1) !important; }

/* ── Stat counter fade ── */
.stat-item, .stat-card { animation: countUp 0.6s ease both; }
.stat-item:nth-child(1), .stat-card:nth-child(1) { animation-delay: 0.05s; }
.stat-item:nth-child(2), .stat-card:nth-child(2) { animation-delay: 0.12s; }
.stat-item:nth-child(3), .stat-card:nth-child(3) { animation-delay: 0.19s; }
.stat-item:nth-child(4), .stat-card:nth-child(4) { animation-delay: 0.26s; }

/* ── Section label dash reveal ── */
.section-label {
  animation: fadeUpIn 0.6s ease both;
  display: inline-block;
}

/* ── Progress bar animation (staff/admin) ── */
.progress-fill {
  transition: width 1.2s cubic-bezier(0.16,1,0.3,1) !important;
}

/* ── Social btn hover spin ── */
.social-btn { transition: background 0.28s, color 0.28s, transform 0.28s !important; }
.social-btn:hover { transform: translateY(-3px) scale(1.08) !important; }

/* ── FAQ arrow transition ── */
.faq-arrow { transition: transform 0.3s ease !important; }
.faq-item.active .faq-arrow { transform: rotate(180deg) !important; }

/* ── Page header decorative pulse ── */
.page-header::before { animation: pulse 8s ease-in-out infinite; }
.welcome-banner::after { animation: pulse 10s ease-in-out infinite 2s; }

/* ── Footer newsletter button ── */
.footer-newsletter button {
  transition: background 0.25s, transform 0.2s !important;
}
.footer-newsletter button:hover { transform: translateY(-2px) !important; }

/* ── Industry item image zoom ── */
.ind-img img { transition: transform 0.55s ease !important; }
.industry-item:hover .ind-img img { transform: scale(1.12) !important; }

/* ── Nav login button ── */
.nav-login { transition: background 0.3s, transform 0.2s !important; }
.nav-login:hover { transform: translateY(-2px) !important; }

/* ── Pricing card featured pulse ── */
.pricing-featured { animation: heroGlow 4s ease-in-out infinite; }

/* ── Float cards hover ── */
.float-card { transition: transform 0.3s ease !important; }
.float-card:hover { transform: translateY(-4px) !important; }

/* ── Budget pill active ── */
.budget-pill { transition: background 0.2s, color 0.2s, transform 0.15s !important; }
.budget-pill.selected { transform: scale(1.04) !important; }

/* ── Dashboard stat cards ── */
.stat-card { transition: box-shadow 0.25s, transform 0.25s !important; }
.stat-card:hover { transform: translateY(-3px) !important; box-shadow: 0 8px 28px rgba(0,0,0,0.1) !important; }

/* ── Task item hover ── */
.task-item { transition: background 0.18s !important; }
.task-check { transition: background 0.22s, border-color 0.22s !important; }

/* ── Toast slide up ── */
.db-toast { transition: all 0.3s cubic-bezier(0.16,1,0.3,1) !important; }

/* ── Mobile: respect reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  .sa, .fade-up, .fade-in { transition: none !important; opacity: 1 !important; transform: none !important; }
  .ticker-track, .hv-img-1, .hv-img-2, .hv-img-3, .hv-badge,
  .scroll-dot::before, .page-header::before { animation: none !important; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {

// Scroll progress
var _sb = document.getElementById('scroll-bar');
if (_sb) {
  window.addEventListener('scroll', function() {
    var total = document.documentElement.scrollHeight - window.innerHeight;
    _sb.style.width = (window.scrollY / total * 100) + '%';
  });
}
// Sticky nav
var _hdr = document.querySelector('header');
if (_hdr) {
  window.addEventListener('scroll', function() {
    _hdr.classList.toggle('scrolled', window.scrollY > 60);
  });
}
// Scroll reveal — not needed since content is always visible, but keep for animation
var _els = document.querySelectorAll('.fade-up, .fade-in');
if (_els.length && window.IntersectionObserver) {
  var _obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0 });
  _els.forEach(function(el) { _obs.observe(el); });
}



function subscribeNewsletter() {
  var input = document.getElementById('newsletter-email');
  var errEl = document.getElementById('nl-error');
  if (!input) return;
  var val = input.value.trim();
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  input.style.borderColor = ''; input.style.background = '';
  if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
  if (!val) { showNLError(input, errEl, 'Please enter your email address.'); return; }
  if (!EMAIL.test(val)) { showNLError(input, errEl, 'Please enter a valid email (e.g. name@example.com).'); return; }
  window.location.href = './404page.html';
}
function showNLError(input, errEl, msg) {
  input.style.borderColor = '#ef4444'; input.style.background = 'rgba(239,68,68,0.07)';
  if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
  input.focus();
  setTimeout(function() {
    input.style.borderColor = ''; input.style.background = '';
    if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
  }, 3500);
}

});
</script>
<script>

// ── Scroll-Reveal Animation Engine ──
(function() {
  function initAnimations() {
    // Fix fade-up: remove the !important override that was killing animations
    var style = document.createElement('style');
    style.textContent = [
      '.fade-up { opacity: 0 !important; transform: translateY(32px) !important; transition: opacity 0.7s ease, transform 0.7s ease !important; }',
      '.fade-up.visible { opacity: 1 !important; transform: translateY(0) !important; }',
      '.fade-in { opacity: 0 !important; transition: opacity 0.9s ease !important; }',
      '.fade-in.visible { opacity: 1 !important; }'
    ].join('\n');
    document.head.appendChild(style);

    if (!window.IntersectionObserver) {
      // Fallback: show everything
      document.querySelectorAll('.fade-up, .fade-in, .sa').forEach(function(el) {
        el.classList.add('visible');
      });
      return;
    }

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.fade-up, .fade-in, .sa').forEach(function(el) {
      observer.observe(el);
    });

    // Counter animation for stat numbers
    var counterObs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (!e.isIntersecting) return;
        var h2 = e.target;
        var target = parseInt(h2.dataset.val || h2.textContent.replace(/[^0-9]/g,''));
        var suffix = h2.dataset.suffix || (h2.textContent.match(/[^0-9]+$/) || [''])[0];
        if (!target) return;
        var cur = 0, step = target / 55;
        var timer = setInterval(function() {
          cur += step;
          if (cur >= target) { cur = target; clearInterval(timer); }
          h2.textContent = Math.floor(cur) + suffix;
        }, 20);
        counterObs.unobserve(h2);
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.stat-num, .stats-strip-grid h3, .stat-box h3, .faq-stat strong').forEach(function(el) {
      counterObs.observe(el);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAnimations);
  } else {
    initAnimations();
  }
})();

</script>
